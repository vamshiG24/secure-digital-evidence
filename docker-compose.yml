services:
  redis:
    image: redis:alpine
    container_name: secure-evidence-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-service:
    image: secure-evidence-backend:latest
    build:
      context: ./server
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-user-service
    command: npm run dev-user
    expose:
      - "5001"
    env_file:
      - ./server/.env
    environment:
      - PORT=5001
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  case-service:
    image: secure-evidence-backend:latest
    build:
      context: ./server
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-case-service
    command: npm run dev-case
    expose:
      - "5002"
    env_file:
      - ./server/.env
    environment:
      - PORT=5002
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  evidence-service:
    image: secure-evidence-backend:latest
    build:
      context: ./server
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-evidence-service
    command: npm run dev-evidence
    expose:
      - "5003"
    env_file:
      - ./server/.env
    environment:
      - PORT=5003
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  notification-service:
    image: secure-evidence-backend:latest
    build:
      context: ./server
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-notification-service
    command: npm run dev-notification
    expose:
      - "5004"
    env_file:
      - ./server/.env
    environment:
      - PORT=5004
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  audit-service:
    image: secure-evidence-backend:latest
    build:
      context: ./server
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-audit-service
    command: npm run dev-audit
    expose:
      - "5005"
    env_file:
      - ./server/.env
    environment:
      - PORT=5005
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped


  frontend:
    build:
      context: ./client
      target: ${BUILD_TARGET:-dev}
    container_name: secure-evidence-frontend
    expose:
      - "5173"
    environment:
      - VITE_PROXY_TARGET=http://nginx:80
      - VITE_API_URL=
    depends_on:
      - user-service
      - case-service
      - evidence-service
    volumes:
      - ./client:/app
      - /app/node_modules
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: secure-evidence-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - user-service
      - case-service
      - evidence-service
      - notification-service
      - audit-service
    restart: unless-stopped

volumes:
  redis-data:
